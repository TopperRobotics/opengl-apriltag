name: Build Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libeigen3-dev \
          libglew-dev \
          libglfw3-dev

    # 1. Check if we already have a cached build of OpenCV 4.14.0
    - name: Cache OpenCV 4.14.0
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/opencv-install
        key: ${{ runner.os }}-opencv-4.14.0

    # 2. Build OpenCV 4.14.0 from source ONLY if the cache was not found
    - name: Build OpenCV 4.14.0
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        git clone --branch 4.14.0 --depth 1 https://github.com/opencv/opencv.git
        cmake -B opencv/build -S opencv \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/opencv-install \
          -DBUILD_TESTS=OFF \
          -DBUILD_PERF_TESTS=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_opencv_apps=OFF \
          -DBUILD_DOCS=OFF
        cmake --build opencv/build --config Release -j $(nproc)
        cmake --install opencv/build

    # 3. Configure your project, explicitly pointing it to the newly built OpenCV
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DOpenCV_DIR=${{ github.workspace }}/opencv-install/lib/cmake/opencv4

    # 4. Build your code
    - name: Build Project
      run: cmake --build ${{github.workspace}}/build --config Release -j $(nproc)

    # 5. Upload the compiled executable
    - name: Upload compiled executable
      uses: actions/upload-artifact@v4
      with:
        name: apriltag
        path: ${{github.workspace}}/build/apriltag
